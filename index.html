<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PureZ Map</title>
  <meta name="description" content="Interactive loot, spawn and vehicle map for PureZ servers.">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;500;600&family=Inter+Tight:wght@800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="app.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
  <script src="icons.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="nav">
    <a href="https://purez.gg" class="logo" aria-label="PureZ home">Pure<span>Z</span><em>Map</em></a>
    <div class="search" role="search">
      <input id="q" type="search" placeholder="Find an item, building or vehicle" autocomplete="off" spellcheck="false" aria-label="Find an item, building or vehicle">
      <kbd class="hint">/</kbd>
      <ul id="results" role="listbox" hidden></ul>
    </div>
    <nav aria-label="Main">
      <a href="https://purez.gg/#servers">Servers</a>
      <a href="https://purez.gg/#features">Features</a>
      <a href="https://wiki.purez.gg">Wiki</a>
      <a href="https://map.purez.gg" aria-current="page">Map</a>
      <a href="https://purez.gg/#play">Play</a>
    </nav>
    <a href="https://discord.gg/JES5Wpkpe5" class="btn" target="_blank" rel="noopener">Join our Discord</a>
    <button class="panel-toggle" type="button" aria-controls="panel" aria-expanded="false">Layers</button>
  </header>

  <div id="map-pick-wrap" class="pick leaflet-control"><label><span class="sr">Map</span><select id="map-pick" aria-label="Map"></select></label></div>

  <div id="map" aria-label="Map"></div>

  <aside id="panel" class="panel">
    <section id="lookup" class="card" hidden></section>

    <section class="sec">
      <div class="base-row">
        <div class="seg" id="base" role="group" aria-label="Base map"></div>
        <button type="button" class="tog" id="grid-toggle" aria-pressed="false" title="Grid">Grid</button>
      </div>
    </section>

    <details class="sec" open>
      <summary><h2>Loot</h2></summary>
      <label class="row"><input type="checkbox" data-layer="buildings"><span>Buildings</span><b class="n" data-count="buildings"></b></label>
      <div class="chips types" id="loot-types" aria-label="Building loot types"></div>
      <label class="row"><input type="checkbox" data-layer="tiers"><span>Loot tiers</span></label>
      <div class="tier-key" id="tier-key" aria-label="Tier outlines"></div>
    </details>

    <details class="sec" open>
      <summary><h2>Spawns</h2></summary>
      <div id="spawn-layers"></div>
    </details>

    <details class="sec" open>
      <summary><h2>World</h2></summary>
      <div id="world-layers"></div>
    </details>

    <details class="sec" open>
      <summary><h2>Tools</h2></summary>
      <div class="tools">
        <button type="button" data-tool="measure" title="Measure distance (R)"></button>
        <button type="button" data-tool="marker" title="Place a marker (M)"></button>
        <button type="button" id="share" title="Copy a link to this view"></button>
      </div>
      <p class="hint-line"><span id="hint"></span> <button type="button" class="link" id="clear-markers" hidden>Clear markers</button></p>
    </details>

    <p class="credit" id="credit"></p>
  </aside>

  <div class="readout" id="readout" aria-live="off"></div>
  <div class="scalebar" id="scalebar"><span></span><b></b></div>
  <div class="ctx" id="ctx" role="menu" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
